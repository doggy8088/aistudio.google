site_name: Google AI Studio 文件｜繁體中文版
site_url: https://aistudio.gh.miniasp.com/
site_description: Google AI Studio 與 Gemini API 官方文件的繁體中文翻譯，每日同步官方版本。
copyright: Copyright © 2026 Google ｜ 繁體中文翻譯：<a href="https://www.facebook.com/will.fans/" target="_blank" rel="noopener">Will 保哥的技術交流中心</a>
theme:
  name: material
  language: zh-TW
  font: false
  custom_dir: overrides
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: 依系統偏好配色
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: blue
      toggle:
        icon: material/brightness-7
        name: 切換至深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: blue
      toggle:
        icon: material/brightness-4
        name: 切換至淺色模式
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
extra_css:
  - assets/aistudio.css
extra_javascript:
  - assets/aistudio.js
extra:
  generator: false
