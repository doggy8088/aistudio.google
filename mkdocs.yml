site_name: Google AI Studio 文件｜繁體中文版
site_url: https://aistudio.gh.miniasp.com/
site_description: Google AI Studio 與 Gemini API 官方文件的繁體中文翻譯，每日同步官方版本。
copyright: Copyright © 2026 Google ｜ 繁體中文翻譯：<a href="https://www.facebook.com/will.fans/" target="_blank" rel="noopener">Will 保哥的技術交流中心</a>
theme:
  name: material
  language: zh-TW
  font: false
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: white
      accent: blue
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
extra_css:
  - assets/aistudio.css
extra:
  generator: false
